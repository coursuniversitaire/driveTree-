<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index,follow">
  <title>%%TITLE%%</title>
  <meta name="description" content="%%META_DESC%%">
  <style>
    /* Minimal design tokens inspired by src/app.html (self-contained, no external fonts) */
    :root{ --space-1:6px; --space-2:8px; --space-3:12px; --space-4:16px; --radius-md:10px; --text-xs:13px; --text-sm:15px; --color-bg-primary:#fff; --color-bg-secondary:#f6f7fb; --color-border-primary:#e6e7ee; --color-border-secondary:#eef0f6; --color-text-primary:#0f1724; --color-text-secondary:#6b7280; --color-danger:#c44; }
    html,body{height:100%}
    body{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans"; color:var(--color-text-primary); background:var(--color-bg-primary); margin:0; padding:18px;}
    header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
    h1{font-size:1.1rem;margin:0}
    .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
    input[type=search]{padding:6px 8px;border:1px solid #ccc;border-radius:6px}
    button{padding:6px 8px;border-radius:6px;border:1px solid #888;background:#f6f6f6;cursor:pointer}
    details{margin-left:12px;margin-top:6px}
    summary{cursor:pointer;list-style:none;display:list-item}
    .node{display:flex;align-items:center;gap:8px;padding:2px 0}
    .meta{color:var(--color-text-secondary);font-size:0.9rem;margin-left:6px}
    .name{white-space:pre-wrap;word-break:break-word}
    .icon{width:20px;text-align:center;display:inline-block}
    .small-note{color:var(--color-danger);font-size:0.85rem;margin-left:6px}
    @media (max-width:600px){body{padding:10px}}
  </style>
</head>
<body>
  <div id="dt-app">
    %%CONTENT%%
  </div>
  <script>
    // Small client-side helpers for the static pages
    (function(){
      function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\\]\\]/g,"\\$&");}
      function filterTree(){
        var q = document.getElementById("dt-search").value.trim().toLowerCase();
        var nodes = document.querySelectorAll("[data-name]");
        if (!q) { nodes.forEach(function(n){ n.style.display=""; }); return; }
        nodes.forEach(function(n){ var name = n.getAttribute("data-name") || ""; var matches = name.toLowerCase().indexOf(q) !== -1; n.style.display = matches ? "" : "none"; });
        document.querySelectorAll("details").forEach(function(d){ d.open = false; });
        var visible = document.querySelectorAll("[data-name]:not([style*='display: none'])");
        visible.forEach(function(el){ var p = el.parentElement; while(p){ if(p.tagName && p.tagName.toLowerCase() === "details"){ p.open = true; } p = p.parentElement; } });
      }
      function expandAll(flag){ document.querySelectorAll("details").forEach(function(d){ d.open = flag; }); }
      document.addEventListener("DOMContentLoaded", function(){ var s=document.getElementById('dt-search'); if(s) s.addEventListener('input', filterTree); var e=document.getElementById('dt-expand-all'); if(e) e.addEventListener('click', function(){ expandAll(true); }); var c=document.getElementById('dt-collapse-all'); if(c) c.addEventListener('click', function(){ expandAll(false); }); });
    })();
  </script>
</body>
</html>
